version: 2
updates:
  # TypeScript API dependencies (Backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Bluefinee"
    commit-message:
      prefix: "🔒 backend"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Ignore major version updates for stable production
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # React Native / Expo App dependencies
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Bluefinee"
    commit-message:
      prefix: "📱 app"
      include: "scope"
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      react:
        patterns:
          - "react"
          - "react-native"
          - "react-native-*"
          - "@react-*"
      zustand:
        patterns:
          - "zustand"
          - "immer"
      testing:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "ts-jest"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Ignore major version updates (Expo SDK upgrades should be manual)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    reviewers:
      - "Bluefinee"
    commit-message:
      prefix: "🔧 ci"
      include: "scope"
