# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto

chat:
  auto_reply: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  assess_linked_issues: true

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - WIP
      - DRAFT
      - "[SKIP]"
    base_branches:
      - main
      - develop

  path_filters:
    # ビルド成果物・依存関係
    - "!node_modules/**"
    - "!.wrangler/**"
    - "!dist/**"
    - "!build/**"
    - "!coverage/**"
    - "!*.min.js"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"

    # Expo / React Native 関連
    - "!.expo/**"
    - "!.expo-shared/**"
    - "!web-build/**"

    # ドキュメント・レビューファイル除外
    - "!**/*.md"
    - "!**/*.txt"
    - "!**/*.rst"
    - "!**/*.adoc"
    - "!docs/**"
    - "!CHANGELOG*"
    - "!README*"
    - "!LICENSE*"
    - "!AUTHORS*"
    - "!CONTRIBUTORS*"

    # 画像・メディア
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.svg"
    - "!**/*.ico"
    - "!**/*.pdf"
    - "!**/*.webp"
    - "!**/*.bmp"
    - "!**/*.tiff"

    # データ・ログファイル（設定ファイルは含める）
    - "!**/*.log"
    - "!**/*.cache"
    - "!**/*.tmp"
    - "!**/*.temp"

    # テストフィクスチャ・スナップショット
    - "!**/fixtures/**"
    - "!**/mocks/**"
    - "!**/__snapshots__/**"
    - "!**/test-data/**"

    # その他の不要ファイル
    - "!**/.DS_Store"

  path_instructions:
    # ===========================================
    # TypeScript/Hono バックエンド
    # ===========================================
    - path: "backend/src/**/*.ts"
      instructions: |
        ## レビュー基準

        ### 1. 型安全性
        - **any型は絶対禁止** → unknown型を使用
        - 全関数で明示的なreturn型を宣言
        - const優先、letは再代入が必要な場合のみ

        ### 2. クリーンアップ（重要）
        - **未使用import**: 使われていないimport文を指摘し削除を要求
        - **未使用変数・関数**: 定義されているが参照されていないものを特定
        - **未使用type/interface**: 定義されているが使用されていない型を検出
        - **到達不可能コード**: return後のコード等を特定
        - **デッドコード**: コメントアウトされたコードは削除を要求

        ### 3. Honoパターン
        - 型付きコンテキスト: `new Hono<{ Bindings: Bindings }>()`
        - routes/にビジネスロジックを書かない（Service層へ分離）
        - レスポンス形式: `{ success: boolean, data?: T, error?: string }`

        ### 4. エラーハンドリング
        - try-catchで適切にエラーを捕捉
        - エラーメッセージは具体的に

    # ===========================================
    # バックエンド テスト
    # ===========================================
    - path: "backend/**/*.test.ts"
      instructions: |
        ## テストレビュー基準
        - **any型使用許可**: テストファイルでは実用性重視でany型の使用を許可
        - テストヘルパー・モックでのany型は問題なし（/* eslint-disable */コメント推奨）
        - Hono testClientの使用確認
        - 適切なモック設計
        - テストケースの網羅性
        - 未使用のテストヘルパー・モックを指摘

    # ===========================================
    # React Native / Expo アプリケーション
    # ===========================================
    - path: "app/src/**/*.{ts,tsx}"
      instructions: |
        ## レビュー基準

        ### 1. 型安全性
        - **any型は絶対禁止** → unknown型を使用
        - 全関数で明示的なreturn型を宣言
        - const優先、letは再代入が必要な場合のみ
        - Props は interface で明示的に定義

        ### 2. クリーンアップ（重要）
        - **未使用import**: 使われていないimport文を指摘し削除を要求
        - **未使用変数・関数**: 定義されているが参照されていないものを特定
        - **未使用type/interface**: 定義されているが使用されていない型を検出
        - **到達不可能コード**: return後のコード等を特定
        - **デッドコード**: コメントアウトされたコードは削除を要求

        ### 3. React Native / Expo パターン
        - **StyleSheet.create()** でスタイル定義（インラインスタイル禁止）
        - デザイントークン（Colors, Spacing, Typography）使用
        - expo-router の正しい使用（useRouter, Link）
        - Arrow function コンポーネント
        - ファイル 400 行以下（超過時はコンポーネント分割を要求）

        ### 4. Zustand ストア
        - セレクターで必要なプロパティのみ選択（リレンダリング最適化）
        - persist middleware の適切な使用
        - ストアの責務分離（user, health, insight）

        ### 5. コンポーネント設計
        - 単一責任: 1コンポーネント1責務
        - Props drilling 回避（必要に応じて Context/Store 使用）
        - memo/useMemo/useCallback の適切な使用

        ### 6. エラーハンドリング
        - **サイレントフェイル禁止**: catch内でconsole.logのみは警告
        - ユーザー通知またはエラー状態の更新を要求
        - エラーメッセージは具体的に

    # ===========================================
    # React Native / Expo ページ（expo-router）
    # ===========================================
    - path: "app/app/**/*.tsx"
      instructions: |
        ## expo-router ページレビュー基準

        ### 1. ルーティング
        - ファイル名とURLパスの一貫性
        - _layout.tsx での適切なナビゲーション設定
        - グループ化（(onboarding), (main)）の適切な使用

        ### 2. 画面構成
        - Screenコンポーネントは薄く保つ（ロジックは hooks/stores へ）
        - SafeAreaView の適切な使用
        - ScrollView vs FlatList の適切な選択

        ### 3. ナビゲーション
        - useRouter() の適切な使用
        - router.push vs router.replace の使い分け

    # ===========================================
    # React Native テスト
    # ===========================================
    - path: "app/**/*.test.{ts,tsx}"
      instructions: |
        ## テストレビュー基準
        - **any型使用許可**: テストファイルでは実用性重視でany型の使用を許可
        - @testing-library/react-native の使用確認
        - 適切なモック設計
        - テストケースの網羅性
        - 未使用のテストヘルパー・モックを指摘

    # ===========================================
    # 設定ファイル
    # ===========================================
    - path: "backend/package.json"
      instructions: |
        設定ファイルのベストプラクティス準拠を確認
        - 不要な依存関係がないか
        - 設定の一貫性
    - path: "backend/tsconfig.json"
      instructions: |
        設定ファイルのベストプラクティス準拠を確認
        - TypeScript設定の適切性
        - 設定の一貫性
    - path: "backend/wrangler.toml"
      instructions: |
        設定ファイルのベストプラクティス準拠を確認
        - Cloudflare Workers設定の適切性
        - 設定の一貫性
    - path: "app/package.json"
      instructions: |
        React Native/Expo 設定ファイルを確認
        - Expo SDK バージョンの互換性
        - 依存関係の適切性
        - scripts の一貫性
    - path: "app/tsconfig.json"
      instructions: |
        TypeScript設定の適切性を確認
        - strict モードの有効化
        - パスエイリアスの設定
    - path: "app/app.json"
      instructions: |
        Expo 設定の適切性を確認
        - バージョン管理
        - プラグイン設定

  # ===========================================
  # ツール設定
  # ===========================================
  tools:
    # TypeScript/JavaScript
    biome:
      enabled: true

    # ESLint（React Native 用）
    eslint:
      enabled: true

    # Swift（無効化 - プロジェクトから削除済み）
    swiftlint:
      enabled: false

    # セキュリティ（APIキー漏洩検出）
    gitleaks:
      enabled: true

    # シェルスクリプト
    shellcheck:
      enabled: true

    # GitHub統合
    github-checks:
      enabled: true
      timeout_ms: 90000

    # AST解析（セキュリティルール）
    ast-grep:
      essential_rules: true

# ===========================================
# トーン設定
# ===========================================
tone_instructions: "Professional constructive review. Check unused code, security issues, file size (400-line limit), and silent error handling patterns. Focus on React Native/Expo best practices and TypeScript type safety."
