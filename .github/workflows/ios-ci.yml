name: iOS CI

on:
  push:
    branches: [main, develop]
    paths:
      - "ios/**/*.swift"
      - "ios/**/*.xc*"
      - ".github/workflows/ios-ci.yml"
      - ".swiftlint.yml"
      - "ios/TempoAI/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "ios/**/*.swift"
      - "ios/**/*.xc*"
      - ".github/workflows/ios-ci.yml"
      - ".swiftlint.yml"
      - "ios/TempoAI/**"
  workflow_dispatch: # 手動実行ボタン

# 同じPRの古いワークフローを自動キャンセル（コスト削減）
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SCHEME: TempoAI
  PROJECT_PATH: ios/TempoAI/TempoAI.xcodeproj
  # ビルド専用（シミュレータ起動不要）
  BUILD_DESTINATION: "generic/platform=iOS Simulator"
  # テスト用（実際のシミュレータが必要）
  TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"
  # カバレッジ閾値（60%から開始、サービス層テスト完了後80%に引き上げ）
  COVERAGE_THRESHOLD: 60

jobs:
  # ===========================================================================
  # Job 1: SwiftLint（Ubuntu で実行 - macOS の 1/10 のコスト）
  # ===========================================================================
  swiftlint:
    name: 🧹 SwiftLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict
        env:
          DIFF_BASE: ${{ github.base_ref }}

  # ===========================================================================
  # Job 2: Build Debug（SwiftLint 成功後に実行）
  # ===========================================================================
  build-debug:
    name: 🔨 Build (Debug)
    runs-on: macos-15
    needs: swiftlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Swift Package Manager のキャッシュ
      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # プロジェクトのスキーム一覧を確認
      - name: List schemes
        run: xcodebuild -list -project ${{ env.PROJECT_PATH }}

      # Debug ビルド実行（generic destination でビルドのみ）
      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.BUILD_DESTINATION }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      # ビルド成果確認
      - name: Verify build output
        run: |
          echo "✅ Debug build completed successfully"

  # ===========================================================================
  # Job 3: Build Release（App Store準備品質チェック）
  # ===========================================================================
  build-release:
    name: 🚀 Build (Release)
    runs-on: macos-15
    needs: swiftlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Swift Package Manager のキャッシュ
      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Release ビルド実行（generic destination でビルドのみ）
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.BUILD_DESTINATION }}" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      # Release ビルド成果確認
      - name: Verify Release build
        run: |
          echo "✅ Release build completed successfully"
          echo "📦 App Store deployment ready"

  # ===========================================================================
  # Job 4: Unit Tests with Coverage（Build 成功後に実行）
  # ===========================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: macos-15
    needs: build-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 利用可能なシミュレータを確認（デバッグ用）
      - name: List available simulators
        run: |
          echo "📱 Available iOS Simulators:"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      # SPM キャッシュを復元
      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # テスト実行（カバレッジ有効化）
      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -project ${{ env.PROJECT_PATH }} \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.TEST_DESTINATION }}" \
            -configuration Debug \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      # カバレッジレポート生成
      - name: Generate coverage report
        run: |
          echo "📊 Code Coverage Summary:"
          if ! xcrun xccov view --report TestResults.xcresult | head -50; then
            echo "⚠️ Warning: Coverage report generation failed or xcresult bundle is invalid"
          fi

      # カバレッジ閾値チェック
      - name: Check coverage threshold
        run: |
          # カバレッジを取得（エラーの場合は警告）
          COVERAGE=$(xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep "TempoAI.app" | awk '{print $NF}' | tr -d '%' || echo "0")

          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "0" ]; then
            echo "::warning::Could not extract coverage percentage from xcresult bundle"
            echo "⚠️ Coverage extraction failed - this may indicate a tooling issue"
            exit 1
          fi

          echo "📈 Total coverage: ${COVERAGE}%"
          echo "🎯 Threshold: ${{ env.COVERAGE_THRESHOLD }}%"

          # 閾値チェック（整数比較）
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
          COVERAGE_INT=${COVERAGE%.*}

          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

          echo "✅ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"

      # カバレッジアーティファクトのアップロード
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults.xcresult
          retention-days: 30

      - name: Test completed
        run: |
          echo "✅ All unit tests passed with coverage reporting"
